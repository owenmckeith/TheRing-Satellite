# Configuration for your own ESPHome dashboard. Copy only this file.
# It gets the Koala firmware from GitHub. You do not need other files.

substitutions:
  # Release of the Koala firmware. To update the device, set a newer release.
  koala_ref: main

packages:
  koala:
    url: https://github.com/owenmckeith/TheRing-Satellite
    #ref: ${koala_ref}
    refresh: 1s
    files:
      - config/common/koala-base.yaml
      - packages/koala/device.yaml #removed from koala-base.yaml

esphome:
  friendly_name: TheRing-VA
  name_add_mac_suffix: false

api:
  encryption:
    key: !secret api_password_ring

wifi:
  ap:
    ssid: "TheRing"
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.27.220

micro_wake_word:
  models:
    - model: wakewords/computer.json
    - model: wakewords/hey_ganddawlf.json

